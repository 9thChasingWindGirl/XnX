# XnX full build — assembles core/ui/providers/shell from our source repos.
# NOTE: enable only after XnX_core / XnX_ui / XnX_providers repos exist and
# READ_PRIVATE_REPOS secret is configured (fine-grained PAT, Contents:read).
name: xnx-full build

on:
  # XnX: full assemble needs all four private repos + PAT; run manually only.
  workflow_dispatch:

permissions:
  contents: read

env:
  BUILD_ORG: ${{ github.repository_owner }}

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      # XnX build gate: every source repo verifies its OWN code on push.
      # Never assemble from an unverified commit.
      - name: Verify source repos are green
        shell: pwsh
        env:
          # Must be the PAT with read access to all 4 source repos.
          # github.token only sees THIS repo -> 403 on cross-repo check-runs.
          GH_TOKEN: ${{ secrets.PAT }}
        run: ./scripts/verify-sources.ps1

      - name: Install toolchains
        uses: dtolnay/rust-toolchain@stable
        with:
          # wasm32 for core-web, msvc for the Windows shell binary
          targets: wasm32-unknown-unknown,x86_64-pc-windows-msvc

      - name: Install Node/pnpm
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Cache wasm-pack binary
        id: cache-wasm-pack
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/wasm-pack
          key: wasm-pack-v1

      - name: Install wasm-pack
        if: steps.cache-wasm-pack.outputs.cache-hit != 'true'
        shell: pwsh
        run: cargo install wasm-pack --locked

      # Assemble sources from private repos. Same PAT as the check workflows
      # (verified working); READ_PRIVATE_REPOS was never configured.
      - name: Assemble sources
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.PAT || github.token }}
        run: |
          git config --global core.autocrlf false
          ./scripts/assemble-full.ps1 2>&1 | Tee-Object -FilePath assemble.log

      # The assemble script uses $ErrorActionPreference=Stop and throws, which
      # aborts the pipeline before inline error handling can run. A separate
      # failure-only step always sees the log and surfaces it as annotations.
      - name: Surface assemble errors
        if: failure()
        shell: pwsh
        run: |
          if (Test-Path assemble.log) {
            Get-Content assemble.log | Select-Object -Last 50 | ForEach-Object {
              Write-Output "::error::$_"
            }
          }

      # --- Encrypt providers: compile Node-side JS to V8 bytecode (.jsc) ---
      # Must use the SAME Node version as stremio-runtime.exe (18.12.1 x64).
      # V8 rejects bytecode compiled by a different Node version.
      # --- Obfuscate providers Node-side JS (version-agnostic, no ABI lock) ---
      # Unlike V8 bytecode, obfuscated JS runs on any Node version/arch.
      - name: Obfuscate providers
        shell: pwsh
        run: |
          node --version
          Push-Location providers
          npm install javascript-obfuscator@5.11.0 --no-save --ignore-scripts
          if ($LASTEXITCODE -ne 0) { throw 'obfuscator install failed' }
          Pop-Location
          node providers/scripts/obfuscate.js providers bundle/providers
          if ($LASTEXITCODE -ne 0) { throw 'obfuscation failed' }

      - name: Smoke test obfuscated provider
        shell: pwsh
        run: |
          # Boot the obfuscated server and send one IPC manifest request.
          # Runs on the CI's default Node (22) — proving no Node-version lock.
          $cfg = 'eyJraW5kIjoibG9jYWwifQ'  # b64url of {"kind":"local"}
          $line = "{`"id`":1,`"method`":`"GET`",`"url`":`"/local/$cfg/manifest.json`"}"
          $out = $line | node bundle/providers/server.js --ipc 2>&1 | Out-String
          Write-Host $out
          if ($LASTEXITCODE -ne 0) { throw "obfuscated server failed: $out" }
          if ($out -notmatch 'org.xnx.local') { throw "manifest missing from obfuscated provider: $out" }
          Write-Host 'obfuscated provider smoke test PASS (Node-version-agnostic)'

      # --- Build the Windows shell from our fork (assemble-full.ps1 cloned it) ---
      # Upstream binaries are NOT in our source repo; cached by upstream HEAD.
      - name: Resolve upstream HEAD
        id: upstream
        shell: bash
        run: |
          # assemble-full set an Authorization extraheader with our scoped PAT
          # — sending it to Stremio's public repo returns HTTP 400. Unset it.
          git config --global --unset-all "http.https://github.com/.extraheader" 2>/dev/null || true
          SHA=$(git ls-remote https://github.com/Stremio/stremio-shell-ng.git refs/heads/main | cut -f1)
          if [ -z "$SHA" ]; then echo "ls-remote failed" >&2; exit 1; fi
          echo "sha=$SHA" >> $GITHUB_OUTPUT

      - name: Cache upstream binaries
        id: cache-upstream
        uses: actions/cache@v4
        with:
          path: |
            upstream/libmpv-2_x64.zip
            upstream/bin
            upstream/mpv-x64
            upstream/server.js
          key: upstream-bin-${{ steps.upstream.outputs.sha }}

      - name: Fetch upstream binary deps (cache miss only)
        if: steps.cache-upstream.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          # clear our scoped PAT header before cloning the public upstream repo
          git config --global --unset-all "http.https://github.com/.extraheader" 2>$null
          git clone --depth 1 https://github.com/Stremio/stremio-shell-ng.git upstream
          if ($LASTEXITCODE -ne 0) { throw 'upstream clone failed' }

      - name: Stage upstream binaries into shell tree
        shell: pwsh
        run: |
          Copy-Item upstream\libmpv-2_x64.zip shell\ -Force
          Copy-Item upstream\bin shell\ -Recurse -Force
          Copy-Item upstream\mpv-x64 shell\ -Recurse -Force
          Copy-Item upstream\server.js shell\ -Force

      - name: Build shell (release)
        shell: cmd
        working-directory: shell
        run: cargo build --release --target x86_64-pc-windows-msvc

      - name: Verify shell exe
        shell: pwsh
        run: |
          $exe = 'shell\target\x86_64-pc-windows-msvc\release\stremio-shell-ng.exe'
          if (-not (Test-Path $exe)) { throw "shell exe missing: $exe" }
          Write-Host "exe size: $((Get-Item $exe).Length)"

      # Swap in DV-capable libmpv (0.42+, PR #17932 FEL support).
      - name: Cache DV-capable libmpv
        id: cache-mpv
        uses: actions/cache@v4
        with:
          path: dv-mpv/libmpv-2.dll
          key: zhongfly-libmpv-20261126-lgpl-x64

      - name: Download DV libmpv (cache miss only)
        if: steps.cache-mpv.outputs.cache-hit != 'true'
        env:
          MPV_TAG: '2026-11-26-1eab28e7b5'
          MPV_ASSET: 'mpv-dev-lgpl-x86_64-20261126-git-1eab28e7b5.7z'
        shell: pwsh
        run: |
          $url = "https://github.com/zhongfly/mpv-winbuild/releases/download/$env:MPV_TAG/$env:MPV_ASSET"
          curl.exe -fL --retry 5 --retry-delay 5 --retry-all-errors -o mpv-dev.7z $url
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path mpv-dev.7z)) { throw "mpv download failed: $url" }
          New-Item -ItemType Directory -Force mpv-dev, dv-mpv | Out-Null
          7z x mpv-dev.7z -ompv-dev -y | Out-Null
          $dll = Get-ChildItem mpv-dev -Recurse -Filter 'libmpv-2.dll' | Select-Object -First 1
          if (-not $dll) { throw 'libmpv-2.dll not found in zhongfly asset' }
          Copy-Item $dll.FullName dv-mpv\libmpv-2.dll -Force

      - name: Stage DV libmpv + provenance
        shell: pwsh
        run: |
          if (-not (Test-Path dv-mpv\libmpv-2.dll)) { throw 'DV libmpv missing' }
          Copy-Item dv-mpv\libmpv-2.dll shell\libmpv-2.dll -Force
          $url = "https://github.com/zhongfly/mpv-winbuild/releases/download/2026-11-26-1eab28e7b5/mpv-dev-lgpl-x86_64-20261126-git-1eab28e7b5.7z"
          "asset: mpv-dev-lgpl-x86_64-20261126-git-1eab28e7b5.7z`ntag: 2026-11-26-1eab28e7b5`nlicence: LGPL`nsource: $url" | Set-Content shell\MPV-SOURCE.txt
          $bytes = [IO.File]::ReadAllBytes('shell\libmpv-2.dll')
          $text = [Text.Encoding]::ASCII.GetString($bytes)
          $ver = [regex]::Match($text, 'mpv v?0\.(\d+)\.(\d+)')
          if (-not $ver.Success) { throw 'cannot find mpv version string' }
          $minor = [int]$ver.Groups[1].Value
          if ($minor -lt 42) { throw "mpv 0.$($ver.Value) < 0.42: no DV FEL support" }
          Write-Host "DV libmpv OK: 0.$minor"

      # --- Bundle Vulkan loader (libmpv's only non-system DLL dependency) ---
      # libmpv imports vulkan-1.dll unconditionally; without it Windows
      # refuses to load the DLL even when playback uses d3d11. Ship the
      # official LunarG VulkanRT loader so users need no GPU-driver install.
      - name: Cache Vulkan runtime
        id: cache-vulkan
        uses: actions/cache@v4
        with:
          path: |
            vulkan-runtime/vulkan-1.dll
            vulkan-runtime/VULKAN-SOURCE.txt
          key: vulkan-rt-1.3.296.0-x64

      - name: Fetch Vulkan loader (cache miss only)
        if: steps.cache-vulkan.outputs.cache-hit != 'true'
        shell: pwsh
        env:
          VK_ZIP: 'VulkanRT-1.3.296.0-Components.zip'
          VK_URL: 'https://sdk.lunarg.com/sdk/download/1.3.296.0/windows/VulkanRT-1.3.296.0-Components.zip'
        run: |
          curl.exe -fL --retry 5 --retry-delay 5 --retry-all-errors -o vk-components.zip $env:VK_URL
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path vk-components.zip)) { throw "VulkanRT download failed: $env:VK_URL" }
          7z x vk-components.zip -oVKExtract -y | Out-Null
          $dll = Get-ChildItem VKExtract -Recurse -Filter 'vulkan-1.dll' |
            Where-Object { $_.FullName -match 'x64' } | Select-Object -First 1
          if (-not $dll) { throw 'x64/vulkan-1.dll not found in VulkanRT components' }
          New-Item -ItemType Directory -Force vulkan-runtime | Out-Null
          Copy-Item $dll.FullName vulkan-runtime\vulkan-1.dll -Force
          "asset: $env:VK_ZIP`nsource: $env:VK_URL`nlicence: Apache-2.0 (Khronos Vulkan Loader)" |
            Set-Content vulkan-runtime\VULKAN-SOURCE.txt
          Write-Host "Vulkan loader staged: $((Get-Item vulkan-runtime\vulkan-1.dll).Length) bytes"

      # Shell binary + mpv + bin/ go to bundle ROOT; ui/ and providers/ are
      # already staged in subfolders by assemble-full.ps1. One complete bundle.
      - name: Stage shell into bundle
        shell: pwsh
        run: |
          Copy-Item shell\target\x86_64-pc-windows-msvc\release\stremio-shell-ng.exe bundle\ -Force
          Copy-Item shell\libmpv-2.dll bundle\ -Force
          Copy-Item shell\bin\* bundle\ -Recurse -Force
          # XnX: do NOT ship upstream stremio-service server.js at bundle root.
          # It starts the old EngineFS/casting server on 11470 and misleads
          # users into `node server.js`. Our service is providers/server.js,
          # launched internally by the exe over IPC.
          Copy-Item shell\MPV-SOURCE.txt bundle\ -Force
          # Non-system runtime DLLs our binary imports — ship them all so the
          # program runs on a clean Windows install with no extra downloads.
          Copy-Item vulkan-runtime\vulkan-1.dll bundle\ -Force
          Copy-Item vulkan-runtime\VULKAN-SOURCE.txt bundle\ -Force
          # Startup guide — the exe is the only entry point. There is no
          # root server.js on purpose (that was the old upstream service).
          $guide = @(
            'XnX Player - START HERE',
            '=======================',
            '',
            'Double-click "stremio-shell-ng.exe" to launch. ONLY entry point.',
            '',
            'DO NOT run "node server.js" - no root server.js by design.',
            'Media-source services live in providers/ and are started by the',
            'exe internally over IPC. The old upstream service opens port',
            '11470 with casting/EngineFS, which is NOT how this build works.',
            '',
            'Layout:',
            '  stremio-shell-ng.exe  main program',
            '  ui/                   interface',
            '  providers/            media-source addons (obfuscated)',
            '  *.dll, bin/           mpv / playback libraries'
          )
          $guide | Set-Content bundle\README-START.txt -Encoding UTF8
          Write-Host "complete bundle: $((Get-ChildItem bundle -Recurse -File).Count) files"

      # Full log as artifact so we can read the real error (annotations are
      # limited to the last 50 lines, which is often just compiler warnings).
      - name: Upload assemble log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: assemble-log
          path: assemble.log
          if-no-files-found: ignore
          retention-days: 3

      # Fail the build if any shipped binary imports a DLL that is neither in
      # the bundle nor a Windows system component (e.g. vulkan-1.dll).
      - name: Check runtime DLL dependencies
        shell: pwsh
        run: python scripts/check-dlls.py bundle

      - name: Package
        shell: pwsh
        run: |
          Compress-Archive -Path bundle/* -DestinationPath xnx-bundle.zip -Force

      - uses: actions/upload-artifact@v4
        with:
          name: xnx-full-bundle
          path: xnx-bundle.zip
          retention-days: 14

name: shell-ng build

# Build the forked stremio-shell-ng (Rust + WebView2 + mpv) from OUR private
# shell repo. Large binaries (mpv/ffmpeg/runtime/server.js) are NOT stored in
# the source repo — pulled from upstream at build time instead.
on:
  # XnX: full build is expensive (370MB upstream + packaging). Trigger manually
  # instead of on every build-repo push; shell-check.yml is the push gate.
  workflow_dispatch:

permissions:
  contents: read

env:
  SHELL_REPO: XnX_shell          # our PRIVATE fork (note lowercase 's')
  UPSTREAM_REPO: Stremio/stremio-shell-ng

jobs:
  build:
    runs-on: windows-2022
    steps:
      # Upstream CI disables EOL translation: rustfmt/build is line-ending sensitive.
      - name: disable git eol translation
        run: git config --global core.autocrlf false

      # --- Our source (private) ---
      - name: Checkout our shell source (private repo)
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/${{ env.SHELL_REPO }}
          ref: main
          path: shell
          # GITHUB_TOKEN cannot read a DIFFERENT private repo; needs a PAT
          # with `repo` scope stored as Actions secret `PAT`.
          token: ${{ secrets.PAT || github.token }}

      # --- Upstream binaries only (not in our source repo) ---
      # Cached by upstream HEAD sha; avoids re-cloning 370MB of bin/mpv every run.
      - name: Resolve upstream HEAD
        id: upstream
        shell: bash
        run: |
          SHA=$(git ls-remote https://github.com/${{ env.UPSTREAM_REPO }}.git refs/heads/main | cut -f1)
          echo "sha=$SHA" >> $GITHUB_OUTPUT

      - name: Cache upstream binaries
        id: cache-upstream
        uses: actions/cache@v4
        with:
          path: |
            upstream/libmpv-2_x64.zip
            upstream/bin
            upstream/mpv-x64
            upstream/server.js
          key: upstream-bin-${{ steps.upstream.outputs.sha }}

      - name: Fetch upstream binary deps (cache miss only)
        if: steps.cache-upstream.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          git clone --depth 1 https://github.com/${{ env.UPSTREAM_REPO }}.git upstream
          Write-Host "cloned upstream binaries"

      # Runs on both hit and miss: upstream/ is populated either way.
      # build.rs needs libmpv zip at source root; installer needs bin/ + server.js.
      - name: Stage upstream binaries into source tree
        shell: pwsh
        run: |
          Copy-Item upstream\libmpv-2_x64.zip shell\ -Force
          Copy-Item upstream\bin shell\ -Recurse -Force
          Copy-Item upstream\mpv-x64 shell\ -Recurse -Force
          Copy-Item upstream\server.js shell\ -Force
          Write-Host "binaries staged: $((Get-ChildItem shell\bin -File).Count) files in bin/"

      # --- Rust build ---
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      # Cache compiled deps + registry, keyed by Cargo.lock. Source unchanged
      # → no recompilation of the ~100 crates on every CI tweak.
      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: shell
          shared-key: shell-ng-release

      - name: Build shell (release)
        shell: cmd
        working-directory: shell
        run: |
          cargo build --release --target x86_64-pc-windows-msvc

      - name: Verify build
        shell: pwsh
        run: |
          $exe = 'shell\target\x86_64-pc-windows-msvc\release\stremio-shell-ng.exe'
          if (-not (Test-Path $exe)) { throw "build output missing: $exe" }
          Write-Host "exe size: $((Get-Item $exe).Length)"

      # --- Swap libmpv: upstream shell-ng ships mpv 0.41 (no DV P7 FEL).
      # Replace with zhongfly LGPL baseline 0.42+ (PR #17932, DV FEL support).
      # LGPL build chosen explicitly; v3/AVX2 builds rejected (old-CPU compat).
      - name: Cache DV-capable libmpv (fixed tag)
        id: cache-mpv
        uses: actions/cache@v4
        with:
          path: dv-mpv/libmpv-2.dll
          key: zhongfly-libmpv-20261126-lgpl-x64

      - name: Download DV-capable libmpv (cache miss only)
        if: steps.cache-mpv.outputs.cache-hit != 'true'
        env:
          MPV_TAG: '2026-11-26-1eab28e7b5'
          MPV_ASSET: 'mpv-dev-lgpl-x86_64-20261126-git-1eab28e7b5.7z'
        shell: pwsh
        run: |
          $url = "https://github.com/zhongfly/mpv-winbuild/releases/download/$env:MPV_TAG/$env:MPV_ASSET"
          # GitHub sometimes 504s large release assets; curl retries transient errors.
          curl.exe -fL --retry 5 --retry-delay 5 --retry-all-errors -o mpv-dev.7z $url
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path mpv-dev.7z)) { throw "download failed: $url" }
          New-Item -ItemType Directory -Force mpv-dev, dv-mpv | Out-Null
          7z x mpv-dev.7z -ompv-dev -y | Out-Null
          $dll = Get-ChildItem mpv-dev -Recurse -Filter 'libmpv-2.dll' | Select-Object -First 1
          if (-not $dll) { throw 'libmpv-2.dll not found in zhongfly asset' }
          Copy-Item $dll.FullName dv-mpv\libmpv-2.dll -Force

      - name: Stage DV-capable libmpv
        shell: pwsh
        env:
          MPV_TAG: '2026-11-26-1eab28e7b5'
          MPV_ASSET: 'mpv-dev-lgpl-x86_64-20261126-git-1eab28e7b5.7z'
        run: |
          if (-not (Test-Path dv-mpv\libmpv-2.dll)) { throw 'cached/downloaded DV libmpv missing' }
          Copy-Item dv-mpv\libmpv-2.dll shell\libmpv-2.dll -Force
          $url = "https://github.com/zhongfly/mpv-winbuild/releases/download/$env:MPV_TAG/$env:MPV_ASSET"
          # provenance (license traceability)
          "asset: $env:MPV_ASSET`ntag: $env:MPV_TAG`nlicence: LGPL`nsource: $url" | Set-Content shell\MPV-SOURCE.txt
          # Verify FEL support by MPV VERSION, not by substring search:
          # the "enhancement layers is currently unsupported" string also
          # exists in FFmpeg/libdovi paths of FEL-capable builds, so it is
          # NOT a reliable negative signal. PR #17932 (DV FEL) landed in 0.42.0.
          $bytes = [IO.File]::ReadAllBytes('shell\libmpv-2.dll')
          $text = [Text.Encoding]::ASCII.GetString($bytes)
          $vers = [regex]::Matches($text, 'mpv v?0\.(\d+)\.(\d+)[^\x00]{0,30}') | ForEach-Object { $_.Value } | Select-Object -Unique
          Write-Host "mpv version strings found: $($vers -join ' | ')"
          $ver = [regex]::Match($text, 'mpv v?0\.(\d+)\.(\d+)')
          if (-not $ver.Success) { throw 'cannot find mpv version string in DLL' }
          $minor = [int]$ver.Groups[1].Value
          $patch = $ver.Groups[2].Value
          if ($minor -lt 42) { throw "mpv 0.$minor.$patch < 0.42: no DV FEL support (PR #17932)" }
          Write-Host "DV-capable libmpv staged: mpv 0.$minor.$patch, $((Get-Item 'shell\libmpv-2.dll').Length) bytes"

      # --- Stage bundle (source-of-truth: what user downloads to Localverify/) ---
      - name: Stage bundle
        shell: pwsh
        run: |
          $dst = 'bundle'
          New-Item -ItemType Directory -Force $dst | Out-Null
          Copy-Item shell\target\x86_64-pc-windows-msvc\release\stremio-shell-ng.exe $dst\ -Force
          Copy-Item shell\libmpv-2.dll $dst\ -Force
          Copy-Item shell\bin\* $dst\ -Recurse -Force
          Copy-Item shell\server.js $dst\ -Force
          Copy-Item shell\MPV-SOURCE.txt $dst\ -Force
          Write-Host "bundle ready: $((Get-ChildItem $dst -Recurse -File).Count) files"

      - uses: actions/upload-artifact@v4
        with:
          name: shell-ng-bundle
          path: bundle/
          retention-days: 14

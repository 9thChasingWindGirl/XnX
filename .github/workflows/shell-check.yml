# Fast compile/test gate for XnX shell changes (no 370MB upstream download,
# no packaging). Push to XnX_shell main then this checks our Rust code.
name: shell check

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

env:
  UPSTREAM_REPO: Stremio/stremio-shell-ng

jobs:
  check:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/XnX_shell
          ref: main
          path: shell
          token: ${{ secrets.PAT || github.token }}

      - name: disable git eol translation
        run: git config --global core.autocrlf false

      # build.rs needs libmpv-2_x64.zip at the source root. Reuse the exact
      # same cache key as shell-ng.yml so the 370MB upstream clone is shared.
      - name: Resolve upstream HEAD
        id: upstream
        shell: bash
        run: |
          SHA=$(git ls-remote https://github.com/${{ env.UPSTREAM_REPO }}.git refs/heads/main | cut -f1)
          echo "sha=$SHA" >> $GITHUB_OUTPUT

      - name: Cache upstream binaries
        id: cache-upstream
        uses: actions/cache@v4
        with:
          path: |
            upstream/libmpv-2_x64.zip
            upstream/bin
            upstream/mpv-x64
            upstream/server.js
          key: upstream-bin-${{ steps.upstream.outputs.sha }}

      - name: Fetch upstream binary deps (cache miss only)
        if: steps.cache-upstream.outputs.cache-hit != 'true'
        shell: pwsh
        run: git clone --depth 1 https://github.com/${{ env.UPSTREAM_REPO }}.git upstream

      - name: Stage libmpv zip into source tree
        shell: pwsh
        run: Copy-Item upstream\libmpv-2_x64.zip shell\ -Force

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: shell

      - name: cargo check
        shell: pwsh
        working-directory: shell
        run: |
          cargo check --target x86_64-pc-windows-msvc 2>&1 | Tee-Object -FilePath cargo-check.log
          if ($LASTEXITCODE -ne 0) {
            Get-Content cargo-check.log | Select-String -Pattern '^error' -Context 0,4 | ForEach-Object {
              $line = ($_.Line + ' ' + ($_.Context.PostContext -join ' ')) -replace "`n",' '
              Write-Output "::error::$line"
            }
            exit $LASTEXITCODE
          }

      - name: cargo test (stremio_server + player)
        shell: pwsh
        working-directory: shell
        run: cargo test --target x86_64-pc-windows-msvc stremio_server
